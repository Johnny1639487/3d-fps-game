<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D First Person Shooter Game</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--fg:#f2f6ff;--acc:#ffb020;--hit:#4cff8a;--panel:rgba(8,14,28,.62);box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;padding:10px 14px;background:var(--panel);border-radius:8px;font-weight:600;font-size:15px;pointer-events:none;line-height:1.5}
#tl{top:calc(10px + env(safe-area-inset-top,0px));left:10px}
#tr{top:calc(10px + env(safe-area-inset-top,0px));right:10px;text-align:right}
#bl{bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;font-size:20px}
#cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;opacity:.9}
#cross:before{left:10px;top:0;width:2px;height:22px}#cross:after{top:10px;left:0;height:2px;width:22px}
#cross.hit:before,#cross.hit:after{background:var(--hit)}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,9,20,.82);text-align:center;cursor:pointer;padding:20px}
#dmg{position:fixed;inset:0;background:radial-gradient(transparent 40%,#e01010);opacity:0;transition:opacity .3s;pointer-events:none}
#rst{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:none;padding:8px 16px;background:var(--panel);color:var(--fg);border:1px solid rgba(255,255,255,.3);border-radius:8px;font:600 15px system-ui,sans-serif;cursor:pointer}
#menu h1{margin:0 0 8px;font-size:clamp(28px,6vw,52px);color:var(--acc)}
#menu p{max-width:520px;margin:6px 0;opacity:.92;line-height:1.5}
#menu b{color:var(--acc)}
.big{margin-top:18px;padding:12px 28px;background:var(--acc);color:#111;border-radius:8px;font-weight:700;font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross"></div><div id="dmg"></div><button id="rst">Restart</button>
<div class="hud" id="tl"></div><div class="hud" id="tr"></div><div class="hud" id="bl"></div>

<div id="menu"><h1>3D First Person Shooter Game</h1>
<p id="msg">Shoot the red enemies before they reach you. Survive for 90 seconds to win</p>
<div class="big" id="go">Click to play</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87b8e8);
scene.fog=new THREE.Fog(0x87b8e8,30,90);
const camera=new THREE.PerspectiveCamera(75,1,0.05,150);
camera.rotation.order='YXZ';scene.add(camera);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xffffff,0x556644,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(20,40,10);scene.add(sun);

// ---- physics world
const world=new CANNON.World();
world.gravity.set(0,-9.8,0);
world.broadphase=new CANNON.NaiveBroadphase();
world.solver.iterations=8;world.allowSleep=true;
const matDef=new CANNON.Material('def'),matPly=new CANNON.Material('ply');
world.addContactMaterial(new CANNON.ContactMaterial(matDef,matDef,{friction:0.4,restitution:0.2}));
world.addContactMaterial(new CANNON.ContactMaterial(matPly,matDef,{friction:0,restitution:0}));
const GRAV={'1':['Earth',9.8],'2':['Moon',1.62],'3':['Mars',3.71]};
let gName='Earth';

const synced=[]; // {mesh,body}
function addBox(w,h,d,x,y,z,mass,color){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));
  mesh.position.set(x,y,z);scene.add(mesh);
  const body=new CANNON.Body({mass,material:matDef,shape:new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)),position:new CANNON.Vec3(x,y,z)});
  world.add(body);if(mass>0)synced.push({mesh,body});
  return {mesh,body};
}
// ground
const gb=new CANNON.Body({mass:0,material:matDef,shape:new CANNON.Plane()});
gb.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0),-Math.PI/2);world.add(gb);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshLambertMaterial({color:0x6f8f5a}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

// ---- player
const player=new CANNON.Body({mass:5,material:matPly,shape:new CANNON.Sphere(0.9),position:new CANNON.Vec3(0,1,15),fixedRotation:true});
player.linearDamping=0;player.allowSleep=false;player.updateMassProperties();world.add(player);
let canJump=false;const cn=new CANNON.Vec3();
player.addEventListener('collide',e=>{const c=e.contact;if(c.bi.id===player.id)c.ni.negate(cn);else cn.copy(c.ni);if(cn.y>0.5)canJump=true});
let yaw=0,pitch=0;

// gun model
const gun=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.14,0.6),new THREE.MeshLambertMaterial({color:0x222831}));
gun.position.set(0.28,-0.25,-0.55);camera.add(gun);
let kick=0;

// ---- enemies
const enemies=[];
function spawnEnemy(){
  const a=Math.random()*Math.PI*2,r=25+Math.random()*10;
  const x=player.position.x+Math.cos(a)*r,z=player.position.z+Math.sin(a)*r;
  const g=new THREE.Group(),parts=[];
  const mk=(w,h,d,col,px,py,pz)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));m.position.set(px,py,pz);g.add(m);parts.push(m)};
  mk(.7,.9,.4,0xc42a2a,0,.15,0);
  mk(.3,.8,.3,0x3a2a2a,-.2,-.5,0);mk(.3,.8,.3,0x3a2a2a,.2,-.5,0);
  mk(.25,.8,.25,0xc42a2a,-.5,.1,0);mk(.25,.8,.25,0xc42a2a,.5,.1,0);
  mk(.45,.45,.45,0xe8b894,0,.8,0);
  scene.add(g);
  const body=new CANNON.Body({mass:3,material:matPly,shape:new CANNON.Box(new CANNON.Vec3(.5,.9,.4)),position:new CANNON.Vec3(x,.9,z),fixedRotation:true});
  body.updateMassProperties();body.allowSleep=false;body.enemy=true;body.hp=3;world.add(body);
  enemies.push({mesh:g,body,parts,cd:0,dead:false});
}
function killEnemy(e){scene.remove(e.mesh);world.remove(e.body);const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1)}
function hurtFlash(){const d=$('dmg');d.style.opacity=.55;setTimeout(()=>d.style.opacity=0,150)}

// ---- bullets
const bullets=[];
const bGeo=new THREE.SphereGeometry(0.08,8,8),bMat=new THREE.MeshBasicMaterial({color:0xffd24a,fog:false,transparent:false,opacity:1});
let audio;
function beep(f,d,v){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='square';g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}

// ---- game state
let state='menu',score=0,health=100,spawnT=0,time=90,ammo=12,reloading=0,shots=0,hits=0,cool=0;
const keys={};let locked=false,firing=false;

function fire(){
  if(cool>0||reloading>0||state!=='play')return;
  if(ammo<=0){reload();return}
  ammo--;shots++;cool=0.18;kick=1;beep(140,.12,.08);
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  const p=camera.getWorldPosition(new THREE.Vector3()).addScaledVector(dir,0.8);
  const mesh=new THREE.Mesh(bGeo,bMat);mesh.position.copy(p);scene.add(mesh);
  const body=new CANNON.Body({mass:0.2,shape:new CANNON.Sphere(0.08),material:matDef,position:new CANNON.Vec3(p.x,p.y,p.z)});
  body.velocity.set(dir.x*35+player.velocity.x,dir.y*35,dir.z*35+player.velocity.z);
  const b={mesh,body,life:3};
  body.addEventListener('collide',e=>{const o=e.body;if(!b.used&&o.enemy&&o.hp>0){b.used=true;hurt(o)}});
  world.add(body);bullets.push(b);
  if(bullets.length>300)removeBullet(bullets[0]);
}
function removeBullet(b){scene.remove(b.mesh);world.remove(b.body);const i=bullets.indexOf(b);if(i>=0)bullets.splice(i,1)}
function hurt(o){
  const e=enemies.find(x=>x.body===o);if(!e||e.dead)return;
  o.hp--;hits++;
  e.parts.forEach(m=>m.material.emissive.set(0xffffff));
  setTimeout(()=>e.parts.forEach(m=>m.material.emissive.set(0x000000)),80);
  const c=$('cross');c.classList.add('hit');setTimeout(()=>c.classList.remove('hit'),150);
  if(o.hp<=0){e.dead=true;score+=100;setTimeout(()=>killEnemy(e),0)}
}
function reload(){if(reloading<=0&&ammo<12){reloading=1.2}}

function startGame(){
  score=0;time=90;ammo=12;shots=0;hits=0;reloading=0;
  bullets.slice().forEach(removeBullet);enemies.slice().forEach(killEnemy);health=100;spawnT=0;for(let i=0;i<4;i++)spawnEnemy();
  player.position.set(0,1,15);player.velocity.set(0,0,0);yaw=0;pitch=0;
  state='play';('menu').style.display='none';('rst').style.display='block';
}
function endGame(){
  state='over';if(document.exitPointerLock)document.exitPointerLock();
  const acc=shots?Math.round(100*hits/shots):0;
  ('go').textContent='Restart';('rst').style.display='none';$('msg').innerHTML='Score: '+score+'\u2003\u2003Accuracy: '+acc+'%';
  $('menu').style.display='flex';
}
$('menu').addEventListener('click',()=>{
  window.focus();canvas.tabIndex=0;canvas.focus();
  try{canvas.requestPointerLock()}catch(e){}
  startGame();
});
$('rst').addEventListener('click',e=>{e.currentTarget.blur();state='menu';firing=false;if(document.exitPointerLock)document.exitPointerLock();$('msg').textContent='Shoot the red enemies before they reach you. Survive for 90 seconds to win';('go').textContent='Clicktoplay';('rst').style.display='none';$('menu').style.display='flex'});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas});
canvas.addEventListener('mousedown',e=>{if(state==='play'&&!locked){try{canvas.requestPointerLock()}catch(_){}}firing=true;fire()});
addEventListener('mouseup',()=>firing=false);
addEventListener('mousemove',e=>{if(!locked||state!=='play')return;yaw-=e.movementX*0.0022;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*0.0022))});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyR')reload();
  if(e.code==='KeyF')firing=true;
  if(GRAV[e.key]){gName=GRAV[e.key][0];world.gravity.set(0,-GRAV[e.key][1],0)}
  if(e.code==='Space')e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyF')firing=false});

// ---- main loop
const clock=new THREE.Clock(),fwd=new THREE.Vector3(),side=new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  if(state==='play'){
    if(keys.ArrowLeft)yaw+=2*dt;if(keys.ArrowRight)yaw-=2*dt;
    if(keys.ArrowUp)pitch=Math.min(1.5,pitch+1.5*dt);if(keys.ArrowDown)pitch=Math.max(-1.5,pitch-1.5*dt);
    fwd.set(-Math.sin(yaw),0,-Math.cos(yaw));side.set(Math.cos(yaw),0,-Math.sin(yaw));
    let mx=0,mz=0;
    if(keys.KeyW)mz+=1;if(keys.KeyS)mz-=1;if(keys.KeyD)mx+=1;if(keys.KeyA)mx-=1;
    const l=Math.hypot(mx,mz)||1,spd=(keys.ShiftLeft?11:7)/l;
    player.velocity.x=(fwd.x*mz+side.x*mx)*spd;
    player.velocity.z=(fwd.z*mz+side.z*mx)*spd;
    if(keys.Space&&canJump){player.velocity.y=6.5;canJump=false}
    if(firing)fire();
    cool-=dt;if(reloading>0){reloading-=dt;if(reloading<=0)ammo=12}
    time-=dt;spawnT-=dt;
    const want=Math.min(4+Math.floor(score/300),12);
    if(spawnT<=0&&enemies.filter(e=>!e.dead).length<want){spawnEnemy();spawnT=1}
    for(const e of enemies){
      if(e.dead)continue;
      const dx=player.position.x-e.body.position.x,dz=player.position.z-e.body.position.z,d=Math.hypot(dx,dz)||1;
      const sp=d>1.8?3.2+Math.min(score/400,2.5):0;
      e.body.velocity.x=dx/d*sp;e.body.velocity.z=dz/d*sp;
      e.mesh.position.copy(e.body.position);e.mesh.rotation.y=Math.atan2(dx,dz);
      e.cd-=dt;
      if(d<2.3&&e.cd<=0){e.cd=0.9;health-=10;hurtFlash()}
    }
    if(health<=0||time<=0){time=Math.max(0,time);endGame()}
  }
  world.step(1/60,dt,3);
  for(const s of synced){s.mesh.position.copy(s.body.position);s.mesh.quaternion.copy(s.body.quaternion)}
  for(const b of bullets){b.mesh.position.copy(b.body.position)}
  camera.position.set(player.position.x,player.position.y+0.7,player.position.z);
  camera.rotation.set(pitch,yaw,0);
  kick=Math.max(0,kick-dt*8);gun.position.z=-0.55+kick*0.08;gun.rotation.x=kick*0.15;
  renderer.render(scene,camera);
  $('tl').innerHTML='Score: '+score+'<br>Time: '+Math.ceil(time)+'s';
  $('tr').innerHTML='Gravity: '+gName+'<br>'+parseFloat(Math.abs(world.gravity.y).toFixed(2))+' m/s²';
  $('bl').textContent='HP '+Math.max(0,Math.round(health))+'\u2003\u2003'+(reloading>0?'Reloading':'Ammo '+ammo+' / 12');
}
loop();
})();
</script>
</body>
</html>
